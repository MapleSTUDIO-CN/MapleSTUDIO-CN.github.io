<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base64 与图像互转工具</title>
    <style>
        :root {
            --bg: #f0f4f8;
            --card-bg: #ffffff;
            --primary: #4a6cf7;
            --primary-hover: #3651d5;
            --primary-light: #eef1fe;
            --text: #1e293b;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --border: #e2e8f0;
            --border-focus: #4a6cf7;
            --success: #10b981;
            --success-bg: #ecfdf5;
            --danger: #ef4444;
            --danger-bg: #fef2f2;
            --warning: #f59e0b;
            --warning-bg: #fffbeb;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 10px 25px -3px rgba(0, 0, 0, 0.1), 0 4px 10px -4px rgba(0, 0, 0, 0.06);
            --radius: 12px;
            --radius-sm: 8px;
            --radius-xs: 6px;
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body::before {
            content: '';
            position: fixed;
            top: -30%;
            right: -20%;
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(74, 108, 247, 0.04) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -25%;
            left: -15%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.03) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 24px 20px 60px;
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }
        .header .icon-wrap {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            background: var(--primary-light);
            border-radius: 16px;
            margin-bottom: 12px;
            font-size: 22px;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: -0.5px;
        }
        .header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.02em;
        }

        .main-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .tab-nav {
            display: flex;
            background: #f8fafc;
            border-bottom: 1px solid var(--border);
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .tab-nav::-webkit-scrollbar {
            display: none;
        }
        .tab-btn {
            flex: 1 0 auto;
            padding: 15px 20px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-secondary);
            transition: var(--transition);
            position: relative;
            white-space: nowrap;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            min-width: 120px;
            font-family: inherit;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .tab-btn:hover {
            color: var(--text);
            background: rgba(74, 108, 247, 0.03);
        }
        .tab-btn.active {
            color: var(--primary);
            font-weight: 600;
            background: rgba(74, 108, 247, 0.04);
        }
        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 20px;
            right: 20px;
            height: 3px;
            background: var(--primary);
            border-radius: 3px 3px 0 0;
        }
        .tab-icon {
            font-size: 1rem;
            flex-shrink: 0;
            font-weight: 600;
        }

        .tab-content {
            display: none;
            padding: 28px 24px;
            animation: fadeSlideIn 0.3s ease;
        }
        .tab-content.active {
            display: block;
        }
        @keyframes fadeSlideIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .drop-zone {
            border: 2px dashed #cbd5e1;
            border-radius: var(--radius-sm);
            padding: 40px 24px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            background: #fafbfc;
            position: relative;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .drop-zone:hover,
        .drop-zone.drag-over {
            border-color: var(--primary);
            background: var(--primary-light);
            box-shadow: 0 0 0 6px rgba(74, 108, 247, 0.04);
        }
        .drop-zone.drag-over {
            border-style: solid;
            transform: scale(1.01);
        }
        .drop-zone-icon {
            font-size: 36px;
            margin-bottom: 10px;
            display: block;
            font-weight: 700;
            color: var(--primary);
            transition: var(--transition);
            letter-spacing: -1px;
        }
        .drop-zone.drag-over .drop-zone-icon {
            transform: translateY(-4px);
        }
        .drop-zone-title {
            font-weight: 600;
            font-size: 1rem;
            color: var(--text);
            margin-bottom: 4px;
        }
        .drop-zone-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .drop-zone input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 18px;
            border-radius: var(--radius-xs);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid transparent;
            transition: var(--transition);
            font-family: inherit;
            white-space: nowrap;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .btn-primary {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
        .btn-primary:hover {
            background: var(--primary-hover);
            border-color: var(--primary-hover);
            box-shadow: 0 4px 12px rgba(74, 108, 247, 0.3);
        }
        .btn-outline {
            background: #fff;
            color: var(--primary);
            border-color: #d0d5f0;
        }
        .btn-outline:hover {
            background: var(--primary-light);
            border-color: var(--primary);
        }
        .btn-sm {
            padding: 6px 13px;
            font-size: 0.8rem;
            border-radius: 6px;
        }
        .btn-xs {
            padding: 4px 10px;
            font-size: 0.75rem;
            border-radius: 5px;
        }
        .btn-success {
            background: var(--success);
            color: #fff;
            border-color: var(--success);
        }
        .btn-success:hover {
            background: #059669;
            border-color: #059669;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        textarea {
            width: 100%;
            min-height: 160px;
            padding: 14px 16px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-family: var(--font-mono);
            font-size: 0.85rem;
            resize: vertical;
            transition: var(--transition);
            background: #fafbfc;
            color: var(--text);
            line-height: 1.5;
        }
        textarea:focus {
            outline: none;
            border-color: var(--border-focus);
            box-shadow: 0 0 0 4px rgba(74, 108, 247, 0.08);
            background: #fff;
        }
        textarea::placeholder {
            color: #b0b8c4;
        }

        .result-area {
            margin-top: 20px;
            display: none;
        }
        .result-area.visible {
            display: block;
            animation: fadeSlideIn 0.35s ease;
        }
        .result-card {
            background: #fafbfc;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 18px;
        }
        .result-card img {
            max-width: 100%;
            max-height: 420px;
            border-radius: 6px;
            display: block;
            margin: 0 auto;
            box-shadow: var(--shadow-sm);
            background: #fff;
            object-fit: contain;
        }
        .result-info {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 14px;
            font-size: 0.82rem;
            color: var(--text-secondary);
        }
        .result-info .tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 5px 12px;
            font-weight: 500;
            font-size: 0.78rem;
        }
        .result-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 14px;
        }

        .base64-preview {
            background: #1e293b;
            color: #e2e8f0;
            border-radius: var(--radius-xs);
            padding: 14px 16px;
            font-family: var(--font-mono);
            font-size: 0.78rem;
            word-break: break-all;
            max-height: 140px;
            overflow-y: auto;
            line-height: 1.5;
            position: relative;
            margin-top: 10px;
            white-space: pre-wrap;
        }
        .base64-preview .truncated-hint {
            color: #f59e0b;
            font-style: italic;
            margin-top: 6px;
            display: block;
            font-size: 0.75rem;
        }

        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }
        .toast {
            background: #1e293b;
            color: #fff;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 0.88rem;
            font-weight: 500;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
            animation: toastIn 0.35s ease, toastOut 0.3s ease 1.8s forwards;
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 8px;
            max-width: 400px;
        }
        .toast.success {
            border-left: 3px solid var(--success);
        }
        .toast.error {
            border-left: 3px solid var(--danger);
        }
        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(60px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        @keyframes toastOut {
            from {
                opacity: 1;
                transform: translateX(0);
            }
            to {
                opacity: 0;
                transform: translateX(60px);
            }
        }

        .extract-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 16px;
        }
        .extract-item {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 16px;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
        }
        .extract-item:hover {
            box-shadow: var(--shadow);
            border-color: #cbd5e1;
        }
        .extract-item-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
        }
        .extract-item-header .index-badge {
            background: var(--primary-light);
            color: var(--primary);
            font-weight: 700;
            font-size: 0.78rem;
            padding: 4px 10px;
            border-radius: 14px;
        }
        .extract-item img {
            max-width: 100%;
            max-height: 280px;
            border-radius: 6px;
            display: block;
            margin: 0 auto;
            background: #fafbfc;
            object-fit: contain;
            border: 1px solid #f1f5f9;
        }
        .extract-item .extract-base64-preview {
            background: #f8fafc;
            border: 1px solid #e8ecf1;
            border-radius: 6px;
            padding: 10px 14px;
            font-family: var(--font-mono);
            font-size: 0.73rem;
            word-break: break-all;
            max-height: 60px;
            overflow: hidden;
            color: #64748b;
            margin-top: 8px;
            line-height: 1.5;
            position: relative;
        }
        .extract-item .extract-base64-preview::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 30px;
            background: linear-gradient(transparent, #f8fafc);
        }
        .extract-item-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
        }
        .extract-empty {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .extract-empty .empty-icon {
            font-size: 36px;
            display: block;
            margin-bottom: 10px;
            font-weight: 700;
            color: #cbd5e1;
        }

        .preview-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 60px;
            background: #fff;
            border-radius: 6px;
            border: 1px solid #f1f5f9;
            padding: 16px;
            margin-top: 12px;
        }
        .preview-container.empty {
            color: #cbd5e1;
            font-size: 0.85rem;
            min-height: 100px;
        }

        .section-title {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        @media (max-width: 640px) {
            .container {
                padding: 12px 10px 40px;
            }
            .tab-btn {
                padding: 12px 14px;
                font-size: 0.82rem;
                gap: 4px;
                min-width: 90px;
            }
            .tab-btn .tab-icon {
                font-size: 0.9rem;
            }
            .tab-content {
                padding: 18px 14px;
            }
            .drop-zone {
                padding: 28px 16px;
            }
            .drop-zone-icon {
                font-size: 28px;
            }
            .header h1 {
                font-size: 1.4rem;
            }
            textarea {
                min-height: 120px;
                font-size: 0.78rem;
            }
            .btn {
                padding: 8px 14px;
                font-size: 0.82rem;
            }
            .result-card img {
                max-height: 280px;
            }
            .extract-item img {
                max-height: 200px;
            }
        }
        @media (max-width: 380px) {
            .tab-btn {
                padding: 10px 8px;
                font-size: 0.72rem;
                gap: 2px;
                min-width: 70px;
            }
            .tab-btn .tab-icon {
                font-size: 0.8rem;
            }
            .tab-btn.active::after {
                left: 8px;
                right: 8px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="icon-wrap">B64</div>
            <h1>Base64 与图像互转工具</h1>
        </div>

        <div class="main-card">
            <div class="tab-nav">
                <button class="tab-btn active" data-tab="tab-image-to-b64" aria-label="图片转Base64">
                    <span class="tab-icon">&raquo;</span> 图片转Base64
                </button>
                <button class="tab-btn" data-tab="tab-b64-to-image" aria-label="Base64转图片">
                    <span class="tab-icon">&laquo;</span> Base64转图片
                </button>
                <button class="tab-btn" data-tab="tab-doc-extract" aria-label="文档提取Base64">
                    <span class="tab-icon">#</span> 文档提取
                </button>
            </div>

            <!-- Tab 1: 图片转Base64 -->
            <div class="tab-content active" id="tab-image-to-b64">
                <div class="drop-zone" id="dropZoneImage">
                    <span class="drop-zone-icon">[ ]</span>
                    <div class="drop-zone-title">点击上传或拖拽图片到此处</div>
                    <div class="drop-zone-desc">支持 JPG / PNG / GIF / WebP / SVG / BMP / ICO</div>
                    <input type="file" id="imageFileInput" accept="image/*">
                </div>
                <div style="margin-top:12px;font-size:0.8rem;color:var(--text-muted);text-align:center;">
                    也可以直接 <kbd style="background:#f1f5f9;padding:2px 7px;border-radius:4px;border:1px solid #dde4ee;">Ctrl+V</kbd> 粘贴剪贴板中的图片
                </div>
                <div class="result-area" id="imageToB64Result">
                    <div class="result-card">
                        <div class="preview-container" id="imagePreviewContainer">
                            <img id="uploadedImagePreview" src="" alt="上传的图片预览" style="display:none;">
                            <span class="empty-state" id="noImagePlaceholder">暂无图片</span>
                        </div>
                        <div class="result-info" id="imageInfo" style="display:none;"></div>
                        <div class="base64-preview" id="imageB64Preview" style="display:none;"></div>
                        <div class="result-actions" id="imageResultActions" style="display:none;">
                            <button class="btn btn-outline btn-sm" id="copyImageB64">复制Base64</button>
                            <button class="btn btn-outline btn-sm" id="copyImageB64Plain">复制纯Base64</button>
                            <button class="btn btn-outline btn-sm" id="downloadImageB64">下载TXT</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tab 2: Base64转图片 -->
            <div class="tab-content" id="tab-b64-to-image">
                <div class="section-title">粘贴 Base64 字符串</div>
                <textarea id="b64Input" placeholder="在此粘贴 Base64 字符串...&#10;支持格式：&#10;- 纯 Base64：iVBORw0KGgo...&#10;- 完整 Data URI：data:image/png;base64,iVBORw0KGgo...&#10;- 带换行的 Base64 字符串"></textarea>
                <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;">
                    <button class="btn btn-primary btn-sm" id="decodeB64Btn">解析并预览</button>
                    <button class="btn btn-outline btn-sm" id="clearB64Input">清空</button>
                    <span style="font-size:0.78rem;color:var(--text-muted);display:flex;align-items:center;margin-left:auto;">
                        字符数：<strong id="b64CharCount">0</strong>
                    </span>
                </div>
                <div class="result-area" id="b64ToImageResult">
                    <div class="result-card">
                        <div class="preview-container" id="decodedImageContainer">
                            <img id="decodedImagePreview" src="" alt="解码后的图片" style="display:none;">
                            <span class="empty-state" id="noDecodedImagePlaceholder">解析后图片将显示在此处</span>
                        </div>
                        <div class="result-info" id="decodedImageInfo" style="display:none;"></div>
                        <div class="result-actions" id="decodedResultActions" style="display:none;">
                            <button class="btn btn-outline btn-sm" id="downloadDecodedImage">下载图片</button>
                            <button class="btn btn-outline btn-sm" id="copyDecodedB64">复制Base64</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tab 3: 文档提取Base64 -->
            <div class="tab-content" id="tab-doc-extract">
                <div class="drop-zone" id="dropZoneDoc">
                    <span class="drop-zone-icon">{ }</span>
                    <div class="drop-zone-title">上传包含 Base64 的文档</div>
                    <div class="drop-zone-desc">支持 TXT / JSON / XML / HTML / CSS / JS / MD / CSV / SVG 等文本文件</div>
                    <input type="file" id="docFileInput" accept=".txt,.json,.xml,.html,.htm,.css,.js,.md,.csv,.log,.yaml,.yml,.svg,.ts,.jsx,.tsx,.vue,.py,.java,.c,.cpp,.h,.php,.rb,.go,.rs,.sh,.bat,.ps1,.config,.ini,.conf">
                </div>
                <div style="margin-top:8px;font-size:0.78rem;color:var(--text-muted);text-align:center;">
                    工具会自动扫描文档中的 Base64 图片数据，屏蔽乱码和无用代码
                </div>
                <div class="result-area" id="docExtractResult">
                    <div class="section-title" id="extractCountTitle" style="display:none;">提取结果</div>
                    <div class="extract-list" id="extractList"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        (function() {
            const tabBtns = document.querySelectorAll('.tab-btn');
            const tabContents = document.querySelectorAll('.tab-content');
            const toastContainer = document.getElementById('toastContainer');

            const dropZoneImage = document.getElementById('dropZoneImage');
            const imageFileInput = document.getElementById('imageFileInput');
            const imageToB64Result = document.getElementById('imageToB64Result');
            const uploadedImagePreview = document.getElementById('uploadedImagePreview');
            const noImagePlaceholder = document.getElementById('noImagePlaceholder');
            const imageInfo = document.getElementById('imageInfo');
            const imageB64Preview = document.getElementById('imageB64Preview');
            const imageResultActions = document.getElementById('imageResultActions');
            const imagePreviewContainer = document.getElementById('imagePreviewContainer');

            const b64Input = document.getElementById('b64Input');
            const b64CharCount = document.getElementById('b64CharCount');
            const decodeB64Btn = document.getElementById('decodeB64Btn');
            const clearB64Input = document.getElementById('clearB64Input');
            const b64ToImageResult = document.getElementById('b64ToImageResult');
            const decodedImagePreview = document.getElementById('decodedImagePreview');
            const noDecodedImagePlaceholder = document.getElementById('noDecodedImagePlaceholder');
            const decodedImageInfo = document.getElementById('decodedImageInfo');
            const decodedResultActions = document.getElementById('decodedResultActions');
            const decodedImageContainer = document.getElementById('decodedImageContainer');

            const dropZoneDoc = document.getElementById('dropZoneDoc');
            const docFileInput = document.getElementById('docFileInput');
            const docExtractResult = document.getElementById('docExtractResult');
            const extractList = document.getElementById('extractList');
            const extractCountTitle = document.getElementById('extractCountTitle');

            function showToast(message, type = 'success') {
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                const prefix = type === 'success' ? '[OK]' : type === 'error' ? '[ERR]' : '[i]';
                toast.innerHTML = `<span>${prefix}</span> ${message}`;
                toastContainer.appendChild(toast);
                setTimeout(() => {
                    if (toast.parentNode) {
                        toast.remove();
                    }
                }, 2200);
            }

            function copyToClipboard(text) {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    return navigator.clipboard.writeText(text).then(() => true).catch(() => false);
                }
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.left = '-9999px';
                textarea.style.top = '-9999px';
                document.body.appendChild(textarea);
                textarea.focus();
                textarea.select();
                try {
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    return Promise.resolve(true);
                } catch (e) {
                    document.body.removeChild(textarea);
                    return Promise.resolve(false);
                }
            }

            function formatBytes(bytes) {
                if (bytes < 1024) return bytes + ' B';
                if (bytes < 1048576) return (bytes / 1024).toFixed(2) + ' KB';
                return (bytes / 1048576).toFixed(2) + ' MB';
            }

            function estimateBase64DecodedSize(b64Length) {
                return Math.round(b64Length * 0.75);
            }

            function cleanBase64Input(input) {
                if (!input || typeof input !== 'string') return { prefix: '', b64: '' };
                let str = input.trim();
                const dataUriMatch = str.match(
                    /^(data:image\/[a-zA-Z0-9.+-]+;base64,)([A-Za-z0-9+/=\s]+)$/i);
                if (dataUriMatch) {
                    const prefix = dataUriMatch[1];
                    const b64 = dataUriMatch[2].replace(/[\s\r\n]+/g, '');
                    return { prefix, b64 };
                }
                const prefixMatch = str.match(/^(data:image\/[^;]*;base64,)\s*/i);
                if (prefixMatch) {
                    const prefix = prefixMatch[1];
                    const b64 = str.substring(prefixMatch[0].length).replace(/[\s\r\n]+/g, '');
                    const cleanedB64 = b64.replace(/[^A-Za-z0-9+/=]/g, '');
                    return { prefix, b64: cleanedB64 };
                }
                let cleaned = str.replace(/[\s\r\n]+/g, '');
                if (/^[A-Za-z0-9+/=]+$/.test(cleaned) && cleaned.length >= 4) {
                    return { prefix: '', b64: cleaned };
                }
                const b64Matches = cleaned.match(/[A-Za-z0-9+/=]{50,}/g);
                if (b64Matches && b64Matches.length > 0) {
                    const longest = b64Matches.reduce((a, b) => a.length >= b.length ? a : b);
                    return { prefix: '', b64: longest };
                }
                return { prefix: '', b64: cleaned.replace(/[^A-Za-z0-9+/=]/g, '') };
            }

            function buildDataUri(b64, prefix) {
                if (prefix) return prefix + b64;
                let mimeType = 'image/png';
                if (b64.startsWith('/9j/')) mimeType = 'image/jpeg';
                else if (b64.startsWith('iVBORw0KGgo')) mimeType = 'image/png';
                else if (b64.startsWith('R0lGOD')) mimeType = 'image/gif';
                else if (b64.startsWith('UklGR')) mimeType = 'image/webp';
                else if (b64.startsWith('Qk')) mimeType = 'image/bmp';
                else if (b64.startsWith('AAAB')) mimeType = 'image/x-icon';
                else if (b64.startsWith('PHN2Zy')) mimeType = 'image/svg+xml';
                return `data:${mimeType};base64,${b64}`;
            }

            function detectMimeFromB64(b64) {
                if (b64.startsWith('/9j/')) return 'image/jpeg';
                if (b64.startsWith('iVBORw0KGgo')) return 'image/png';
                if (b64.startsWith('R0lGOD')) return 'image/gif';
                if (b64.startsWith('UklGR')) return 'image/webp';
                if (b64.startsWith('Qk')) return 'image/bmp';
                if (b64.startsWith('AAAB')) return 'image/x-icon';
                if (b64.startsWith('PHN2Zy')) return 'image/svg+xml';
                return 'image/png';
            }

            function getImageExtension(mimeType) {
                const map = {
                    'image/jpeg': 'jpg',
                    'image/png': 'png',
                    'image/gif': 'gif',
                    'image/webp': 'webp',
                    'image/bmp': 'bmp',
                    'image/x-icon': 'ico',
                    'image/svg+xml': 'svg',
                };
                return map[mimeType] || 'png';
            }

            tabBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    const targetTab = this.getAttribute('data-tab');
                    tabBtns.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    tabContents.forEach(tc => tc.classList.remove('active'));
                    const targetContent = document.getElementById(targetTab);
                    if (targetContent) {
                        targetContent.classList.add('active');
                        targetContent.style.animation = 'none';
                        targetContent.offsetHeight;
                        targetContent.style.animation = '';
                    }
                });
            });

            function handleImageFile(file) {
                if (!file || !file.type.startsWith('image/')) {
                    showToast('请上传有效的图片文件', 'error');
                    return;
                }
                const reader = new FileReader();
                reader.onload = function(e) {
                    const dataUri = e.target.result;
                    const commaIndex = dataUri.indexOf(',');
                    const prefix = dataUri.substring(0, commaIndex + 1);
                    const b64 = dataUri.substring(commaIndex + 1);

                    uploadedImagePreview.src = dataUri;
                    uploadedImagePreview.style.display = 'block';
                    noImagePlaceholder.style.display = 'none';
                    imagePreviewContainer.classList.remove('empty');

                    const img = new Image();
                    img.onload = function() {
                        const estimatedSize = estimateBase64DecodedSize(b64.length);
                        imageInfo.innerHTML = `
                            <span class="tag">尺寸: ${img.naturalWidth} x ${img.naturalHeight} px</span>
                            <span class="tag">原始: ${formatBytes(file.size)}</span>
                            <span class="tag">Base64: ${b64.length.toLocaleString()} 字符</span>
                            <span class="tag">解码: ${formatBytes(estimatedSize)}</span>
                            <span class="tag">格式: ${file.type || '未知'}</span>
                        `;
                        imageInfo.style.display = 'flex';
                    };
                    img.src = dataUri;

                    const previewText = b64.length > 500 ?
                        b64.substring(0, 500) + '...' :
                        b64;
                    imageB64Preview.innerHTML =
                        `<code>${escapeHTML(previewText)}</code>` +
                        (b64.length > 500 ?
                            `<span class="truncated-hint">已截断显示，完整长度：${b64.length.toLocaleString()} 字符。点击下方按钮复制完整内容。</span>` :
                            '');
                    imageB64Preview.style.display = 'block';
                    imageResultActions.style.display = 'flex';
                    imageToB64Result.classList.add('visible');

                    imageToB64Result.dataset.fullB64 = b64;
                    imageToB64Result.dataset.prefix = prefix;
                    imageToB64Result.dataset.dataUri = dataUri;
                    imageToB64Result.dataset.mimeType = file.type;
                    imageToB64Result.dataset.filename = file.name;

                    showToast('图片转换成功');
                };
                reader.readAsDataURL(file);
            }

            imageFileInput.addEventListener('change', function() {
                if (this.files && this.files[0]) {
                    handleImageFile(this.files[0]);
                }
            });

            dropZoneImage.addEventListener('dragover', function(e) {
                e.preventDefault();
                e.stopPropagation();
                this.classList.add('drag-over');
            });
            dropZoneImage.addEventListener('dragleave', function(e) {
                e.preventDefault();
                e.stopPropagation();
                this.classList.remove('drag-over');
            });
            dropZoneImage.addEventListener('drop', function(e) {
                e.preventDefault();
                e.stopPropagation();
                this.classList.remove('drag-over');
                const files = e.dataTransfer.files;
                if (files && files.length > 0) {
                    handleImageFile(files[0]);
                }
            });

            dropZoneImage.addEventListener('click', function(e) {
                if (e.target !== imageFileInput) {
                    imageFileInput.click();
                }
            });

            document.getElementById('copyImageB64').addEventListener('click', function() {
                const dataUri = imageToB64Result.dataset.dataUri;
                if (dataUri) {
                    copyToClipboard(dataUri).then(success => {
                        showToast(success ? '完整 Data URI 已复制' : '复制失败', success ?
                            'success' : 'error');
                    });
                }
            });

            document.getElementById('copyImageB64Plain').addEventListener('click', function() {
                const b64 = imageToB64Result.dataset.fullB64;
                if (b64) {
                    copyToClipboard(b64).then(success => {
                        showToast(success ? '纯 Base64 已复制' : '复制失败', success ? 'success' :
                            'error');
                    });
                }
            });

            document.getElementById('downloadImageB64').addEventListener('click', function() {
                const dataUri = imageToB64Result.dataset.dataUri;
                const filename = (imageToB64Result.dataset.filename || 'image') + '.base64.txt';
                if (dataUri) {
                    downloadTextFile(dataUri, filename);
                    showToast('Base64 文本文件已下载');
                }
            });

            function downloadTextFile(content, filename) {
                const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }

            function escapeHTML(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            b64Input.addEventListener('input', function() {
                const len = this.value.replace(/[\s\r\n]/g, '').length;
                b64CharCount.textContent = len.toLocaleString();
            });

            clearB64Input.addEventListener('click', function() {
                b64Input.value = '';
                b64CharCount.textContent = '0';
                b64ToImageResult.classList.remove('visible');
                decodedImagePreview.style.display = 'none';
                noDecodedImagePlaceholder.style.display = '';
                decodedImageInfo.style.display = 'none';
                decodedResultActions.style.display = 'none';
                decodedImageContainer.classList.add('empty');
            });

            function decodeAndPreviewB64() {
                const rawInput = b64Input.value;
                if (!rawInput.trim()) {
                    showToast('请先粘贴 Base64 字符串', 'error');
                    return;
                }
                const { prefix, b64 } = cleanBase64Input(rawInput);
                if (!b64 || b64.length < 4) {
                    showToast('未能识别有效的 Base64 字符串，请检查输入', 'error');
                    return;
                }
                const dataUri = buildDataUri(b64, prefix);
                const mimeType = detectMimeFromB64(b64);

                const img = new Image();
                img.onload = function() {
                    decodedImagePreview.src = dataUri;
                    decodedImagePreview.style.display = 'block';
                    noDecodedImagePlaceholder.style.display = 'none';
                    decodedImageContainer.classList.remove('empty');
                    const estimatedSize = estimateBase64DecodedSize(b64.length);
                    decodedImageInfo.innerHTML = `
                        <span class="tag">尺寸: ${img.naturalWidth} x ${img.naturalHeight} px</span>
                        <span class="tag">Base64: ${b64.length.toLocaleString()} 字符</span>
                        <span class="tag">解码: ${formatBytes(estimatedSize)}</span>
                        <span class="tag">格式: ${mimeType}</span>
                    `;
                    decodedImageInfo.style.display = 'flex';
                    decodedResultActions.style.display = 'flex';
                    b64ToImageResult.classList.add('visible');
                    b64ToImageResult.dataset.dataUri = dataUri;
                    b64ToImageResult.dataset.b64 = b64;
                    b64ToImageResult.dataset.mimeType = mimeType;
                    showToast('Base64 解析成功');
                };
                img.onerror = function() {
                    showToast('无法将Base64解析为有效图片，请检查数据完整性', 'error');
                    decodedImagePreview.style.display = 'none';
                    noDecodedImagePlaceholder.style.display = '';
                    noDecodedImagePlaceholder.textContent = '解析失败，Base64数据可能不完整或已损坏';
                    decodedImageContainer.classList.add('empty');
                    decodedImageInfo.style.display = 'none';
                    decodedResultActions.style.display = 'none';
                    b64ToImageResult.classList.add('visible');
                };
                img.src = dataUri;
            }

            decodeB64Btn.addEventListener('click', decodeAndPreviewB64);

            document.getElementById('downloadDecodedImage').addEventListener('click', function() {
                const dataUri = b64ToImageResult.dataset.dataUri;
                const mimeType = b64ToImageResult.dataset.mimeType || 'image/png';
                const ext = getImageExtension(mimeType);
                if (dataUri) {
                    const a = document.createElement('a');
                    a.href = dataUri;
                    a.download = `decoded_image.${ext}`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    showToast('图片已下载');
                }
            });

            document.getElementById('copyDecodedB64').addEventListener('click', function() {
                const dataUri = b64ToImageResult.dataset.dataUri;
                if (dataUri) {
                    copyToClipboard(dataUri).then(success => {
                        showToast(success ? 'Base64 已复制' : '复制失败', success ? 'success' :
                            'error');
                    });
                }
            });

            function extractBase64FromText(text) {
                const results = [];
                const seenB64 = new Set();

                const dataUriRegex = /data:image\/[a-zA-Z0-9.+-]+;base64,\s*([A-Za-z0-9+/=\s]+?)(?=\s*["'\s<)}\]])/gi;
                let match;
                while ((match = dataUriRegex.exec(text)) !== null) {
                    const rawB64 = match[1].replace(/[\s\r\n]+/g, '');
                    if (rawB64.length >= 40 && !seenB64.has(rawB64)) {
                        seenB64.add(rawB64);
                        const fullMatch = match[0].replace(/[\s\r\n]+/g, '');
                        const prefixMatch = fullMatch.match(/^(data:image\/[^;]*;base64,)/i);
                        const prefix = prefixMatch ? prefixMatch[1] : '';
                        results.push({
                            b64: rawB64,
                            prefix: prefix,
                            dataUri: prefix ? prefix + rawB64 : buildDataUri(rawB64, ''),
                            length: rawB64.length,
                            source: 'data URI',
                        });
                    }
                }

                const htmlDataUriRegex =
                    /(?:src|href|content|url)\s*=\s*["'](data:image\/[^"']+base64,[A-Za-z0-9+/=\s]+?)["']/gi;
                while ((match = htmlDataUriRegex.exec(text)) !== null) {
                    const fullDataUri = match[1].replace(/[\s\r\n]+/g, '');
                    const commaIdx = fullDataUri.indexOf(',');
                    const prefix = fullDataUri.substring(0, commaIdx + 1);
                    const b64 = fullDataUri.substring(commaIdx + 1).replace(/[\s\r\n]+/g, '');
                    if (b64.length >= 40 && !seenB64.has(b64)) {
                        seenB64.add(b64);
                        results.push({
                            b64: b64,
                            prefix: prefix,
                            dataUri: prefix + b64,
                            length: b64.length,
                            source: 'HTML属性',
                        });
                    }
                }

                const cssUrlRegex = /url\(\s*(data:image\/[^)]+base64,[A-Za-z0-9+/=\s]+?)\s*\)/gi;
                while ((match = cssUrlRegex.exec(text)) !== null) {
                    const fullDataUri = match[1].replace(/[\s\r\n]+/g, '');
                    const commaIdx = fullDataUri.indexOf(',');
                    const prefix = fullDataUri.substring(0, commaIdx + 1);
                    const b64 = fullDataUri.substring(commaIdx + 1).replace(/[\s\r\n]+/g, '');
                    if (b64.length >= 40 && !seenB64.has(b64)) {
                        seenB64.add(b64);
                        results.push({
                            b64: b64,
                            prefix: prefix,
                            dataUri: prefix + b64,
                            length: b64.length,
                            source: 'CSS url()',
                        });
                    }
                }

                let remainingText = text;
                seenB64.forEach(existingB64 => {
                    remainingText = remainingText.replace(existingB64, '');
                });
                remainingText = remainingText.replace(/data:image\/[^;]*;base64,/gi, '');

                const pureB64Regex = /[A-Za-z0-9+/=]{200,}/g;
                while ((match = pureB64Regex.exec(remainingText)) !== null) {
                    const rawB64 = match[0].replace(/[\s\r\n]+/g, '');
                    if (rawB64.length >= 200 && !seenB64.has(rawB64)) {
                        const paddingOk = rawB64.length % 4 === 0 || rawB64.endsWith('=');
                        if (paddingOk || rawB64.length > 300) {
                            seenB64.add(rawB64);
                            results.push({
                                b64: rawB64,
                                prefix: '',
                                dataUri: buildDataUri(rawB64, ''),
                                length: rawB64.length,
                                source: '纯Base64序列',
                            });
                        }
                    }
                }

                results.sort((a, b) => b.length - a.length);
                return results;
            }

            function handleDocFile(file) {
                if (!file) return;
                if (file.size > 50 * 1024 * 1024) {
                    showToast('文件过大（超过50MB），请选择较小的文件', 'error');
                    return;
                }
                const reader = new FileReader();
                reader.onload = function(e) {
                    const text = e.target.result;
                    const extracted = extractBase64FromText(text);
                    renderExtractResults(extracted, file.name);
                };
                reader.onerror = function() {
                    showToast('文件读取失败，请重试', 'error');
                };
                reader.readAsText(file);
            }

            function renderExtractResults(results, filename) {
                extractList.innerHTML = '';
                docExtractResult.classList.add('visible');

                if (results.length === 0) {
                    extractList.innerHTML = `
                        <div class="extract-empty">
                            <span class="empty-icon">( )</span>
                            <p>未在文档中找到有效的 Base64 图片数据</p>
                            <p style="font-size:0.78rem;color:#94a3b8;">文件：${escapeHTML(filename)}</p>
                            <p style="font-size:0.75rem;color:#b0b8c4;">请确认文档中包含 data:image/...;base64,... 格式的图片数据</p>
                        </div>`;
                    extractCountTitle.style.display = 'none';
                    return;
                }

                extractCountTitle.style.display = 'block';
                extractCountTitle.textContent =
                    `在 "${filename}" 中找到 ${results.length} 个 Base64 图片${results.length > 1 ? '（已去重）' : ''}`;

                results.forEach((item, index) => {
                    const card = document.createElement('div');
                    card.className = 'extract-item';
                    const previewB64 = item.b64.length > 300 ? item.b64.substring(0, 300) + '...' : item
                        .b64;
                    const estimatedSize = estimateBase64DecodedSize(item.b64.length);
                    const mimeType = detectMimeFromB64(item.b64);
                    card.innerHTML = `
                        <div class="extract-item-header">
                            <span class="index-badge">#${index + 1}</span>
                            <span style="font-size:0.78rem;color:var(--text-muted);">来源：${item.source}</span>
                            <span style="font-size:0.75rem;color:var(--text-muted);">${item.b64.length.toLocaleString()} 字符 / ${formatBytes(estimatedSize)}</span>
                        </div>
                        <img src="${item.dataUri}" alt="提取的图片 #${index + 1}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='block';">
                        <div style="display:none;text-align:center;padding:20px;color:#ef4444;font-size:0.85rem;">图片无法渲染，Base64数据可能不完整</div>
                        <div class="extract-base64-preview">
                            <code>${escapeHTML(previewB64)}</code>
                        </div>
                        <div class="extract-item-actions">
                            <button class="btn btn-outline btn-xs copy-datauri-btn" data-datauri="${escapeHTML(item.dataUri)}">复制Data URI</button>
                            <button class="btn btn-outline btn-xs copy-pureb64-btn" data-b64="${escapeHTML(item.b64)}">复制纯Base64</button>
                            <button class="btn btn-outline btn-xs download-extract-btn" data-datauri="${escapeHTML(item.dataUri)}" data-mime="${mimeType}">下载图片</button>
                        </div>
                    `;
                    extractList.appendChild(card);
                });

                extractList.querySelectorAll('.copy-datauri-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const dataUri = this.getAttribute('data-datauri');
                        copyToClipboard(dataUri).then(success => {
                            showToast(success ? 'Data URI 已复制' : '复制失败',
                                success ? 'success' : 'error');
                        });
                    });
                });
                extractList.querySelectorAll('.copy-pureb64-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const b64 = this.getAttribute('data-b64');
                        copyToClipboard(b64).then(success => {
                            showToast(success ? '纯Base64已复制' : '复制失败',
                                success ? 'success' : 'error');
                        });
                    });
                });
                extractList.querySelectorAll('.download-extract-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const dataUri = this.getAttribute('data-datauri');
                        const mime = this.getAttribute('data-mime') || 'image/png';
                        const ext = getImageExtension(mime);
                        const a = document.createElement('a');
                        a.href = dataUri;
                        a.download = `extracted_image_${Date.now()}.${ext}`;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        showToast('图片已下载');
                    });
                });

                docExtractResult.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }

            docFileInput.addEventListener('change', function() {
                if (this.files && this.files[0]) {
                    handleDocFile(this.files[0]);
                }
            });

            dropZoneDoc.addEventListener('dragover', function(e) {
                e.preventDefault();
                e.stopPropagation();
                this.classList.add('drag-over');
            });
            dropZoneDoc.addEventListener('dragleave', function(e) {
                e.preventDefault();
                e.stopPropagation();
                this.classList.remove('drag-over');
            });
            dropZoneDoc.addEventListener('drop', function(e) {
                e.preventDefault();
                e.stopPropagation();
                this.classList.remove('drag-over');
                const files = e.dataTransfer.files;
                if (files && files.length > 0) {
                    handleDocFile(files[0]);
                }
            });
            dropZoneDoc.addEventListener('click', function(e) {
                if (e.target !== docFileInput) {
                    docFileInput.click();
                }
            });

            document.addEventListener('paste', function(e) {
                const clipboardItems = e.clipboardData?.items;
                if (!clipboardItems) return;

                for (let i = 0; i < clipboardItems.length; i++) {
                    const item = clipboardItems[i];
                    if (item.type.startsWith('image/')) {
                        e.preventDefault();
                        const file = item.getAsFile();
                        if (file) {
                            tabBtns.forEach(b => b.classList.remove('active'));
                            const tab1Btn = document.querySelector('[data-tab="tab-image-to-b64"]');
                            if (tab1Btn) tab1Btn.classList.add('active');
                            tabContents.forEach(tc => tc.classList.remove('active'));
                            const tab1Content = document.getElementById('tab-image-to-b64');
                            if (tab1Content) {
                                tab1Content.classList.add('active');
                                tab1Content.style.animation = 'none';
                                tab1Content.offsetHeight;
                                tab1Content.style.animation = '';
                            }
                            handleImageFile(file);
                            showToast('已从剪贴板粘贴图片');
                        }
                        break;
                    }
                }
            });

            b64CharCount.textContent = '0';

            b64Input.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                    e.preventDefault();
                    decodeAndPreviewB64();
                }
            });

            console.log('Base64 与图像互转工具已就绪');
        })();
    </script>
</body>
</html>
